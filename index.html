<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El iguano | Caps & Sportswear</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #f5f5f0; /* Color marfil de la iguana */
            --accent-hover: #e2e2dc;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border-color: #2a2a2a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 90px;
        }

        /* Header */
        header {
            background-color: #181818;
            padding: 25px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent-color);
            font-weight: 800;
        }

        header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 5px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Categorías */
        .categories {
            display: flex;
            gap: 10px;
            padding: 15px;
            overflow-x: auto;
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
        }

        .category-btn {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 8px 18px;
            border-radius: 25px;
            white-space: nowrap;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .category-btn.active {
            background-color: var(--accent-color);
            color: #121212;
            border-color: var(--accent-color);
        }

        /* Catálogo de Productos */
        .catalog {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            padding: 15px;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid var(--border-color);
        }

        .product-img {
            width: 100%;
            height: 170px;
            object-fit: cover;
            background-color: #252525;
        }

        .product-info {
            padding: 12px;
        }

        .product-title {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .product-price {
            color: var(--accent-color);
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .btn-add {
            width: 100%;
            background-color: var(--accent-color);
            color: #121212;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Botón Flotante de Pedido por WhatsApp */
        .cart-bar {
            position: fixed;
            bottom: 15px;
            left: 5%;
            width: 90%;
            background-color: var(--accent-color);
            color: #121212;
            padding: 14px 20px;
            border-radius: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- Encabezado -->
    <header>
        <h1>El iguano</h1>
        <p>Caps & Sportswear</p>
    </header>

    <!-- Filtros de Categoría -->
    <div class="categories">
        <button class="category-btn active">Todas</button>
        <button class="category-btn">Gorras</button>
        <button class="category-btn">Ropa Deportiva</button>
        <button class="category-btn">Ofertas</button>
    </div>

    <!-- Lista de Productos Muestra -->
    <main class="catalog">
        <div class="product-card">
            <img src="https://via.placeholder.com/300x300/1e1e1e/f5f5f0?text=Gorra+Ejemplo" alt="Gorra" class="product-img">
            <div class="product-info">
                <div class="product-title">Gorra Snapback Negra</div>
                <div class="product-price">$350 MXN</div>
                <button class="btn-add" onclick="pedirProducto('Gorra Snapback Negra')">Pedir por WhatsApp</button>
            </div>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/300x300/1e1e1e/f5f5f0?text=Playera+Ejemplo" alt="Playera" class="product-img">
            <div class="product-info">
                <div class="product-title">Playera Deportiva Fit</div>
                <div class="product-price">$280 MXN</div>
                <button class="btn-add" onclick="pedirProducto('Playera Deportiva Fit')">Pedir por WhatsApp</button>
            </div>
        </div>
    </main>

    <!-- Botón directo a WhatsApp -->
    <a href="#" id="whatsapp-link" class="cart-bar">
        <span>🛒 Catálogo completo</span>
        <span>WhatsApp &rarr;</span>
    </a>

    <script>
        // Cambia este número por tu número de WhatsApp real (ej: 521234567890)
        const numeroTelefono = "520000000000"; 

        function pedirProducto(nombreProducto) {
            const mensaje = encodeURIComponent(`Hola El iguano, vi tu página web y me interesa comprar: ${nombreProducto}`);
            window.open(`https://wa.me/${numeroTelefono}?text=${mensaje}`, '_blank');
        }

        document.getElementById('whatsapp-link').href = `https://wa.me/${numeroTelefono}?text=${encodeURIComponent('Hola El iguano, me gustaría realizar una consulta sobre sus productos.')}`;
    </script>
</body>
</html>
