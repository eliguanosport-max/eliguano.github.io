<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El iguano | Caps & Sportswear</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 80px;
        }

        /* Header */
        header {
            background-color: var(--card-bg);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--accent-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-color);
        }

        header p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Categorías */
        .categories {
            display: flex;
            gap: 10px;
            padding: 15px;
            overflow-x: auto;
            background-color: var(--bg-color);
        }

        .category-btn {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--accent-color);
            padding: 8px 16px;
            border-radius: 20px;
            white-space: nowrap;
            cursor: pointer;
            font-weight: 600;
        }

        .category-btn.active {
            background-color: var(--accent-color);
            color: #000;
        }

        /* Catálogo de Productos */
        .catalog {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            padding: 15px;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #334155;
        }

        .product-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background-color: #334155;
        }

        .product-info {
            padding: 12px;
        }

        .product-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .product-price {
            color: var(--accent-color);
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .btn-add {
            width: 100%;
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Botón Flotante de Pedido por WhatsApp */
        .cart-bar {
            position: fixed;
            bottom: 15px;
            left: 5%;
            width: 90%;
            background-color: var(--accent-color);
            color: #000;
            padding: 15px;
            border-radius: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
            cursor: pointer;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- Encabezado -->
    <header>
        <h1>El iguano</h1>
        <p>Caps & Sportswear</p>
    </header>

    <!-- Filtros de Categoría -->
    <div class="categories">
        <button class="category-btn active">Todas</button>
        <button class="category-btn">Gorras</button>
        <button class="category-btn">Ropa Deportiva</button>
        <button class="category-btn">Ofertas</button>
    </div>

    <!-- Lista de Productos Muestra -->
    <main class="catalog">
        <div class="product-card">
            <img src="https://via.placeholder.com/300x300?text=Gorra+Ejemplo" alt="Gorra" class="product-img">
            <div class="product-info">
                <div class="product-title">Gorra Snapback Negra</div>
                <div class="product-price">$350 MXN</div>
                <button class="btn-add" onclick="pedirProducto('Gorra Snapback Negra')">Pedir por WhatsApp</button>
            </div>
        </div>

        <div class="product-card">
            <img src="https://via.placeholder.com/300x300?text=Playera+Ejemplo" alt="Playera" class="product-img">
            <div class="product-info">
                <div class="product-title">Playera Deportiva Fit</div>
                <div class="product-price">$280 MXN</div>
                <button class="btn-add" onclick="pedirProducto('Playera Deportiva Fit')">Pedir por WhatsApp</button>
            </div>
        </div>
    </main>

    <!-- Botón directo a WhatsApp -->
    <a href="#" id="whatsapp-link" class="cart-bar">
        <span>🛒 Consultar catálogo general</span>
        <span>Enviar WhatsApp &rarr;</span>
    </a>

    <script>
        // Cambia este número por tu número de WhatsApp real con clave de país (ej: 521234567890)
        const numeroTelefono = "520000000000"; 

        function pedirProducto(nombreProducto) {
            const mensaje = encodeURIComponent(`Hola El iguano, vi tu página web y me interesa comprar: ${nombreProducto}`);
            window.open(`https://wa.me/${numeroTelefono}?text=${mensaje}`, '_blank');
        }

        document.getElementById('whatsapp-link').href = `https://wa.me/${numeroTelefono}?text=${encodeURIComponent('Hola El iguano, me gustaría realizar una consulta sobre sus productos.')}`;
    </script>
</body>
</html>
