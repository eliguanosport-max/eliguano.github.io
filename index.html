<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El iguano | Caps & Sportswear</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #f5f5f0;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border-color: #2a2a2a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 90px;
        }

        /* Header Dinámico */
        header {
            background-color: #181818;
            padding: 20px 15px 15px 15px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .brand-logo {
            width: 70px;
            height: 70px;
            object-fit: contain;
            border-radius: 50%;
            transition: all 0.3s ease;
            user-select: none;
        }

        .header-text {
            max-height: 100px;
            opacity: 1;
            overflow: hidden;
            transition: all 0.3s ease;
            margin-top: 8px;
        }

        header h1 {
            font-size: 1.6rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent-color);
            font-weight: 800;
        }

        header p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        header.scrolled {
            padding: 8px 15px;
        }

        header.scrolled .brand-logo {
            width: 42px;
            height: 42px;
        }

        header.scrolled .header-text {
            max-height: 0;
            opacity: 0;
            margin-top: 0;
        }

        /* Barra de Búsqueda */
        .search-container {
            padding: 12px 15px 5px 15px;
            background-color: var(--bg-color);
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 25px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-color);
        }

        /* Categorías y Botón Admin */
        .categories-wrapper {
            display: flex;
            align-items: center;
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 60px;
            z-index: 90;
            padding: 10px 15px;
            gap: 10px;
        }

        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            flex-grow: 1;
        }

        .category-btn {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 8px 18px;
            border-radius: 25px;
            white-space: nowrap;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .category-btn.active {
            background-color: var(--accent-color);
            color: #121212;
            border-color: var(--accent-color);
        }

        .btn-admin-add {
            display: none;
            background-color: #22c55e;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
        }

        /* Catálogo */
        .catalog {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            padding: 15px;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .product-img {
            width: 100%;
            height: 170px;
            object-fit: cover;
            background-color: #252525;
        }

        .product-info {
            padding: 12px;
        }

        .product-title {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .product-price {
            color: var(--accent-color);
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .btn-add {
            width: 100%;
            background-color: var(--accent-color);
            color: #121212;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-delete-admin {
            display: none;
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(239, 68, 68, 0.9);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            font-weight: bold;
            cursor: pointer;
            z-index: 5;
        }

        /* Barra Inferior del Carrito */
        .cart-bar {
            position: fixed;
            bottom: 15px;
            left: 5%;
            width: 90%;
            background-color: var(--accent-color);
            color: #121212;
            padding: 14px 20px;
            border-radius: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            z-index: 101;
        }

        /* Modales (Carrito y Admin) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 200;
            justify-content: center;
            align-items: flex-end;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            background-color: #181818;
            width: 100%;
            max-width: 500px;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            border-top: 1px solid var(--border-color);
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .modal-header h2 {
            font-size: 1.2rem;
            color: var(--accent-color);
        }

        .close-modal {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .cart-items {
            overflow-y: auto;
            flex-grow: 1;
            margin-bottom: 15px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .cart-item-title {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .cart-item-price {
            font-size: 0.85rem;
            color: var(--accent-color);
        }

        .cart-item-remove {
            background: none;
            border: none;
            color: #ef4444;
            margin-left: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .cart-footer {
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .btn-send-whatsapp {
            width: 100%;
            background-color: #22c55e;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Formulario Administrador */
        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.9rem;
        }

        .btn-save-product {
            width: 100%;
            background-color: var(--accent-color);
            color: #121212;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Encabezado -->
    <header id="main-header">
        <img src="Logo.jpeg" alt="El iguano Logo" class="brand-logo">
        <div class="header-text">
            <h1>El iguano</h1>
            <p>Caps & Sportswear</p>
        </div>
    </header>

    <!-- Barra de Búsqueda -->
    <div class="search-container">
        <input type="text" id="search-input" class="search-input" placeholder="🔍 Buscar gorra, playera, hoodie..." oninput="ejecutarBusqueda()">
    </div>

    <!-- Barra de Categorías y Botón de Admin -->
    <div class="categories-wrapper">
        <div class="categories">
            <button class="category-btn active" onclick="filtrarCategoria('Todas', this)">Todas</button>
            <button class="category-btn" onclick="filtrarCategoria('Gorras', this)">Gorras</button>
            <button class="category-btn" onclick="filtrarCategoria('Ropa Deportiva', this)">Ropa Deportiva</button>
            <button class="category-btn" onclick="filtrarCategoria('Ofertas', this)">Ofertas</button>
        </div>
        <button class="btn-admin-add" id="btn-admin-add" onclick="abrirModalAdmin()">➕ Agregar Producto</button>
    </div>

    <!-- Catálogo de Productos -->
    <main class="catalog" id="catalog-container">
        <!-- Productos cargados mediante JavaScript -->
    </main>

    <!-- Barra Flotante del Carrito -->
    <div class="cart-bar" onclick="abrirCarrito()">
        <span id="cart-count-label">🛒 Carrito (0)</span>
        <span id="cart-total-label">$0 MXN &rarr;</span>
    </div>

    <!-- Modal del Carrito -->
    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Tu Pedido</h2>
                <button class="close-modal" onclick="cerrarCarrito()">&times;</button>
            </div>
            <div class="cart-items" id="cart-items-container">
                <p style="color: var(--text-muted); text-align: center;">El carrito está vacío.</p>
            </div>
            <div class="cart-footer">
                <div class="cart-total">
                    <span>Total:</span>
                    <span id="modal-total-label">$0 MXN</span>
                </div>
                <button class="btn-send-whatsapp" onclick="enviarPedidoWhatsApp()">Enviar pedido por WhatsApp</button>
            </div>
        </div>
    </div>

    <!-- Modal Agregar Producto (Solo Modo Admin) -->
    <div class="modal" id="admin-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Nuevo Producto</h2>
                <button class="close-modal" onclick="cerrarModalAdmin()">&times;</button>
            </div>
            <form id="form-nuevo-producto" onsubmit="guardarNuevoProducto(event)">
                <div class="form-group">
                    <label>Nombre del Producto:</label>
                    <input type="text" id="prod-nombre" placeholder="Ej. Gorra Snapback Negra" required>
                </div>
                <div class="form-group">
                    <label>Precio (MXN):</label>
                    <input type="number" id="prod-precio" placeholder="350" required>
                </div>
                <div class="form-group">
                    <label>Categoría:</label>
                    <select id="prod-categoria">
                        <option value="Gorras">Gorras</option>
                        <option value="Ropa Deportiva">Ropa Deportiva</option>
                        <option value="Ofertas">Ofertas</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Cargar Imagen desde tu Celular/PC:</label>
                    <input type="file" id="prod-file" accept="image/*" onchange="convertirImagenADataURL(event)">
                </div>
                <div class="form-group">
                    <label>O Enlace/Nombre de Imagen guardada:</label>
                    <input type="text" id="prod-img-url" placeholder="ejemplo.jpg o URL">
                </div>
                <button type="submit" class="btn-save-product">Publicar Producto</button>
            </form>
        </div>
    </div>

    <script>
        const numeroTelefono = "520000000000"; // Reemplaza con tu WhatsApp real
        const PALABRA_CLAVE_ADMIN = "admin123"; // Escribe esto en la búsqueda para activar Admin
        const ADMIN_PASSWORD = "iguano2026";    // Contraseña final del Administrador

        let esAdmin = false;
        let carrito = [];
        let categoriaActual = 'Todas';

        let productos = JSON.parse(localStorage.getItem('iguano_productos')) || [
            { id: 1, nombre: "Gorra Snapback Negra", precio: 350, categoria: "Gorras", img: "https://via.placeholder.com/300x300/1e1e1e/f5f5f0?text=Gorra+Snapback+Negra" },
            { id: 2, nombre: "Gorra Trucker Marfil", precio: 320, categoria: "Gorras", img: "https://via.placeholder.com/300x300/1e1e1e/f5f5f0?text=Gorra+Trucker+Marfil" },
            { id: 3, nombre: "Playera Slim Fit Negra", precio: 280, categoria: "Ropa Deportiva", img: "https://via.placeholder.com/300x300/1e1e1e/f5f5f0?text=Playera+Slim+Fit" },
            { id: 4, nombre: "Hoodie Oversize Negra", precio: 550, categoria: "Ofertas", img: "https://via.placeholder.com/300x300/1e1e1e/f5f5f0?text=Hoodie+Oversize" }
        ];

        let imagenTemporalBase64 = "";

        document.addEventListener("DOMContentLoaded", () => {
            renderizarCatalogo(productos);
        });

        function renderizarCatalogo(lista) {
            const container = document.getElementById('catalog-container');
            container.innerHTML = '';

            if (lista.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); text-align: center; grid-column: 1/-1; padding: 20px;">No se encontraron productos.</p>';
                return;
            }

            lista.forEach(prod => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    ${esAdmin ? `<button class="btn-delete-admin" style="display:block;" onclick="eliminarProducto(${prod.id})">&times;</button>` : ''}
                    <img src="${prod.img}" alt="${prod.nombre}" class="product-img">
                    <div class="product-info">
                        <div class="product-title">${prod.nombre}</div>
                        <div class="product-price">$${prod.precio} MXN</div>
                        <button class="btn-add" onclick="agregarAlCarrito('${prod.nombre}', ${prod.precio})">+ Agregar al carrito</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Búsqueda en tiempo real & Detección de Código Secreto
        function ejecutarBusqueda() {
            const query = document.getElementById('search-input').value.trim();

            // Código secreto para activar Admin
            if (query.toLowerCase() === PALABRA_CLAVE_ADMIN.toLowerCase()) {
                document.getElementById('search-input').value = '';
                activarModoAdmin();
                return;
            }

            let filtrados = productos;

            if (categoriaActual !== 'Todas') {
                filtrados = filtrados.filter(p => p.categoria === categoriaActual);
            }

            if (query !== '') {
                filtrados = filtrados.filter(p => p.nombre.toLowerCase().includes(query.toLowerCase()));
            }

            renderizarCatalogo(filtrados);
        }

        // Filtro por categorías
        function filtrarCategoria(categoria, btn) {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            categoriaActual = categoria;
            ejecutarBusqueda();
        }

        // Carrito
        function agregarAlCarrito(nombre, precio) {
            carrito.push({ nombre, precio });
            actualizarCarritoUI();
        }

        function eliminarDelCarrito(index) {
            carrito.splice(index, 1);
            actualizarCarritoUI();
        }

        function actualizarCarritoUI() {
            const countLabel = document.getElementById('cart-count-label');
            const totalLabel = document.getElementById('cart-total-label');
            const modalTotalLabel = document.getElementById('modal-total-label');
            const itemsContainer = document.getElementById('cart-items-container');

            const total = carrito.reduce((sum, item) => sum + item.precio, 0);

            countLabel.textContent = `🛒 Carrito (${carrito.length})`;
            totalLabel.textContent = `$${total} MXN →`;
            modalTotalLabel.textContent = `$${total} MXN`;

            if (carrito.length === 0) {
                itemsContainer.innerHTML = '<p style="color: var(--text-muted); text-align: center;">El carrito está vacío.</p>';
            } else {
                itemsContainer.innerHTML = '';
                carrito.forEach((item, index) => {
                    const itemElement = document.createElement('div');
                    itemElement.className = 'cart-item';
                    itemElement.innerHTML = `
                        <div>
                            <div class="cart-item-title">${item.nombre}</div>
                            <div class="cart-item-price">$${item.precio} MXN</div>
                        </div>
                        <button class="cart-item-remove" onclick="eliminarDelCarrito(${index})">Quitar</button>
                    `;
                    itemsContainer.appendChild(itemElement);
                });
            }
        }

        function abrirCarrito() { document.getElementById('cart-modal').classList.add('open'); }
        function cerrarCarrito() { document.getElementById('cart-modal').classList.remove('open'); }

        function enviarPedidoWhatsApp() {
            if (carrito.length === 0) {
                alert("Agrega al menos un producto al carrito antes de realizar el pedido.");
                return;
            }
            let listaProductos = carrito.map(item => `- ${item.nombre}: $${item.precio} MXN`).join('\n');
            let total = carrito.reduce((sum, item) => sum + item.precio, 0);
            let mensaje = `Hola *El iguano*, me gustaría realizar el siguiente pedido desde la página web:\n\n${listaProductos}\n\n*Total a pagar:* $${total} MXN`;
            window.open(`https://wa.me/${numeroTelefono}?text=${encodeURIComponent(mensaje)}`, '_blank');
        }

        // ACTIVAR MODO ADMIN DESDE LA BÚSQUEDA
        function activarModoAdmin() {
            const pass = prompt("Acceso Administrador 'El iguano'\nIngresa la contraseña:");
            if (pass === ADMIN_PASSWORD) {
                esAdmin = true;
                alert("¡Modo Administrador activado!");
                document.getElementById('btn-admin-add').style.display = "block";
                renderizarCatalogo(productos);
            } else if (pass !== null) {
                alert("Contraseña incorrecta.");
            }
        }

        function abrirModalAdmin() { document.getElementById('admin-modal').classList.add('open'); }
        function cerrarModalAdmin() { document.getElementById('admin-modal').classList.remove('open'); }

        function convertirImagenADataURL(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagenTemporalBase64 = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function guardarNuevoProducto(event) {
            event.preventDefault();
            const nombre = document.getElementById('prod-nombre').value;
            const precio = parseFloat(document.getElementById('prod-precio').value);
            const categoria = document.getElementById('prod-categoria').value;
            const urlInput = document.getElementById('prod-img-url').value;

            let imgFinal = imagenTemporalBase64 || urlInput || "https://via.placeholder.com/300x300/1e1e1e/f5f5f0?text=El+Iguano";

            const nuevoProd = {
                id: Date.now(),
                nombre,
                precio,
                categoria,
                img: imgFinal
            };

            productos.push(nuevoProd);
            localStorage.setItem('iguano_productos', JSON.stringify(productos));
            renderizarCatalogo(productos);
            
            document.getElementById('form-nuevo-producto').reset();
            imagenTemporalBase64 = "";
            cerrarModalAdmin();
            alert("¡Producto agregado exitosamente!");
        }

        function eliminarProducto(id) {
            if (confirm("¿Estás seguro de eliminar este producto del catálogo?")) {
                productos = productos.filter(p => p.id !== id);
                localStorage.setItem('iguano_productos', JSON.stringify(productos));
                renderizarCatalogo(productos);
            }
        }

        // Animación Scroll Header
        window.addEventListener('scroll', function() {
            const header = document.getElementById('main-header');
            if (window.scrollY > 30) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });
    </script>
</body>
</html>
