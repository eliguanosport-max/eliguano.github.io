<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El iguano | Caps & Sportswear</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #f5f5f0;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border-color: #2a2a2a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 90px;
        }

        /* Header */
        header {
            background-color: #181818;
            padding: 20px 15px 15px 15px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .header-content {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .admin-profile-btn {
            position: absolute;
            top: 0;
            right: 10px;
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
            color: var(--text-muted);
        }

        .admin-profile-btn:hover {
            border-color: var(--accent-color);
            color: var(--text-main);
            background-color: rgba(255, 255, 255, 0.05);
        }

        .admin-profile-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .admin-profile-btn.logged-in {
            border-color: #22c55e;
            color: #22c55e;
            background-color: rgba(34, 197, 94, 0.1);
        }

        .brand-logo {
            width: 70px;
            height: 70px;
            object-fit: contain;
            border-radius: 50%;
            transition: all 0.3s ease;
            user-select: none;
        }

        .header-text {
            max-height: 100px;
            opacity: 1;
            overflow: hidden;
            transition: all 0.3s ease;
            margin-top: 8px;
        }

        header h1 {
            font-size: 1.6rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent-color);
            font-weight: 800;
        }

        header p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        header.scrolled {
            padding: 8px 15px;
        }

        header.scrolled .brand-logo {
            width: 42px;
            height: 42px;
        }

        header.scrolled .header-text {
            max-height: 0;
            opacity: 0;
            margin-top: 0;
        }

        header.scrolled .admin-profile-btn {
            top: -2px;
            width: 34px;
            height: 34px;
        }

        header.scrolled .admin-profile-btn svg {
            width: 18px;
            height: 18px;
        }

        /* Búsqueda */
        .search-container {
            padding: 12px 15px 5px 15px;
            background-color: var(--bg-color);
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 25px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-color);
        }

        /* Categorías y Acciones Admin */
        .categories-wrapper {
            display: flex;
            align-items: center;
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 60px;
            z-index: 90;
            padding: 10px 15px;
            gap: 10px;
        }

        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            flex-grow: 1;
        }

        .category-btn {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 8px 18px;
            border-radius: 25px;
            white-space: nowrap;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .category-btn.active {
            background-color: var(--accent-color);
            color: #121212;
            border-color: var(--accent-color);
        }

        .admin-controls {
            display: flex;
            gap: 8px;
        }

        .btn-admin-add, .btn-admin-cat {
            display: none;
            background-color: #22c55e;
            color: #ffffff;
            border: none;
            padding: 8px 14px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-admin-cat {
            background-color: #3b82f6;
        }

        .btn-admin-logout {
            display: none;
            background-color: #ef4444;
            color: #ffffff;
            border: none;
            padding: 8px 14px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
        }

        /* Catálogo */
        .catalog {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            padding: 15px;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .product-card.out-of-stock .product-img {
            opacity: 0.4;
            filter: grayscale(80%);
        }

        .badge-out-of-stock {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: #ef4444;
            color: #ffffff;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            z-index: 4;
        }

        .product-img {
            width: 100%;
            height: 170px;
            object-fit: cover;
            background-color: #252525;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .product-img:hover {
            transform: scale(1.02);
        }

        .product-info {
            padding: 12px;
        }

        .product-title {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .product-price {
            color: var(--accent-color);
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .product-size-select {
            width: 100%;
            padding: 6px;
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.8rem;
            margin-bottom: 10px;
            outline: none;
            cursor: pointer;
        }

        .product-size-select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-add {
            width: 100%;
            background-color: var(--accent-color);
            color: #121212;
            border: none;
            padding: 9px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-disabled {
            width: 100%;
            background-color: #333333;
            color: #777777;
            border: none;
            padding: 9px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: not-allowed;
            text-transform: uppercase;
        }

        /* Controles de Administración en Tarjetas */
        .btn-delete-admin {
            display: none;
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(239, 68, 68, 0.9);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            font-weight: bold;
            cursor: pointer;
            z-index: 5;
        }

        .btn-edit-admin {
            display: none;
            position: absolute;
            top: 8px;
            right: 40px;
            background: rgba(59, 130, 246, 0.9);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 5;
            align-items: center;
            justify-content: center;
        }

        .btn-toggle-stock-admin {
            display: none;
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(34, 197, 94, 0.9);
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 0 8px;
            height: 28px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 5;
        }

        /* Carrito */
        .cart-bar {
            position: fixed;
            bottom: 15px;
            left: 5%;
            width: 90%;
            background-color: var(--accent-color);
            color: #121212;
            padding: 14px 20px;
            border-radius: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            z-index: 101;
        }

        /* Modales */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 200;
            justify-content: center;
            align-items: flex-end;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            background-color: #181818;
            width: 100%;
            max-width: 500px;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            border-top: 1px solid var(--border-color);
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .modal-header h2 {
            font-size: 1.2rem;
            color: var(--accent-color);
        }

        .close-modal {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .cart-items {
            overflow-y: auto;
            flex-grow: 1;
            margin-bottom: 15px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
            gap: 10px;
        }

        .cart-item-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-grow: 1;
        }

        .cart-item-img {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 8px;
            background-color: #252525;
            border: 1px solid var(--border-color);
        }

        .cart-item-details {
            display: flex;
            flex-direction: column;
        }

        .cart-item-title {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .cart-item-size {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .cart-item-price {
            font-size: 0.85rem;
            color: var(--accent-color);
            font-weight: 700;
        }

        .cart-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cart-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: var(--card-bg);
            padding: 4px 8px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .btn-qty {
            background: none;
            border: none;
            color: var(--text-main);
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .btn-qty:active {
            background-color: var(--border-color);
        }

        .cart-qty {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-color);
            min-width: 16px;
            text-align: center;
        }

        .btn-remove-item {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-footer {
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .btn-send-whatsapp {
            width: 100%;
            background-color: #22c55e;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Formulario Administrador */
        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-group input[type="text"], 
        .form-group input[type="email"], 
        .form-group input[type="password"], 
        .form-group input[type="number"], 
        .form-group select {
            width: 100%;
            padding: 10px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.9rem;
        }

        .sizes-checkbox-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            background-color: var(--card-bg);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .size-checkbox-label {
            display: flex;
            align-items: center;
            gap: 5px;
            background-color: #2a2a2a;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            user-select: none;
            border: 1px solid var(--border-color);
        }

        .size-checkbox-label input[type="checkbox"] {
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        .btn-save-product {
            width: 100%;
            background-color: var(--accent-color);
            color: #121212;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Lista de gestión de categorías */
        .category-manage-list {
            margin-top: 15px;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
        }

        .category-manage-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .btn-delete-cat {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <header id="main-header">
        <div class="header-content">
            <button class="admin-profile-btn" id="admin-profile-btn" onclick="manejarClicIconoAdmin()" title="Mi Cuenta">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
                </svg>
            </button>
            <img src="Logo.jpeg" alt="El iguano Logo" class="brand-logo">
            <div class="header-text">
                <h1>El iguano</h1>
                <p>Caps & Sportswear</p>
            </div>
        </div>
    </header>

    <div class="search-container">
        <input type="text" id="search-input" class="search-input" placeholder="🔍 Buscar gorra, playera, hoodie..." oninput="ejecutarBusqueda()">
    </div>

    <div class="categories-wrapper">
        <div class="categories" id="categories-bar">
            <!-- Renderizado dinámico de categorías -->
        </div>
        <div class="admin-controls">
            <button class="btn-admin-cat" id="btn-admin-cat" onclick="abrirModalCategorias()">🏷️ Categorías</button>
            <button class="btn-admin-add" id="btn-admin-add" onclick="abrirModalAdminCrear()">➕ Agregar</button>
            <button class="btn-admin-logout" id="btn-admin-logout" onclick="cerrarSesionAdmin()">Salir</button>
        </div>
    </div>

    <main class="catalog" id="catalog-container">
        <p style="color: var(--text-muted); text-align: center; grid-column: 1/-1; padding: 20px;">Cargando productos...</p>
    </main>

    <div class="cart-bar" onclick="abrirCarrito()">
        <span id="cart-count-label">🛒 Carrito (0 prendas)</span>
        <span id="cart-total-label">$0 MXN &rarr;</span>
    </div>

    <!-- Modal Visor de Imagen -->
    <div class="modal" id="image-viewer-modal" style="align-items: center;" onclick="cerrarVisorImagen()">
        <div style="position: relative; max-width: 90vw; max-height: 90vh; display: flex; justify-content: center; align-items: center;" onclick="event.stopPropagation()">
            <button class="close-modal" onclick="cerrarVisorImagen()" style="position: absolute; top: -40px; right: 0; color: #fff; font-size: 2.5rem;">&times;</button>
            <img id="image-viewer-img" src="" alt="Vista previa" style="max-width: 100%; max-height: 80vh; border-radius: 12px; object-fit: contain; box-shadow: 0 10px 30px rgba(0,0,0,0.8);">
        </div>
    </div>

    <!-- Modal Carrito -->
    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Tu Pedido</h2>
                <button class="close-modal" onclick="cerrarCarrito()">&times;</button>
            </div>
            <div class="cart-items" id="cart-items-container">
                <p style="color: var(--text-muted); text-align: center;">El carrito está vacío.</p>
            </div>
            <div class="cart-footer">
                <div class="cart-total">
                    <span>Cuenta Total:</span>
                    <span id="modal-total-label">$0 MXN</span>
                </div>
                <button class="btn-send-whatsapp" onclick="enviarPedidoWhatsApp()">Enviar pedido por WhatsApp</button>
            </div>
        </div>
    </div>

    <!-- Modal Login -->
    <div class="modal" id="login-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>INICIAR SESIÓN</h2>
                <button class="close-modal" onclick="cerrarModalLogin()">&times;</button>
            </div>
            <form id="form-login-admin" onsubmit="iniciarSesionAdmin(event)">
                <div class="form-group">
                    <label>Correo Electrónico:</label>
                    <input type="email" id="login-email" placeholder="tu-correo@email.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña:</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-save-product" id="btn-login-submit">INICIAR SESIÓN</button>
            </form>
        </div>
    </div>

    <!-- Modal Gestión de Categorías Admin -->
    <div class="modal" id="categories-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Administrar Categorías</h2>
                <button class="close-modal" onclick="cerrarModalCategorias()">&times;</button>
            </div>
            <form id="form-nueva-categoria" onsubmit="agregarCategoria(event)">
                <div class="form-group">
                    <label>Nueva Categoría:</label>
                    <input type="text" id="cat-nombre" placeholder="Ej. Chaquetas, Accesorios..." required>
                </div>
                <button type="submit" class="btn-save-product">Agregar Categoría</button>
            </form>
            <div class="category-manage-list" id="category-manage-list">
                <!-- Lista de categorías editables -->
            </div>
        </div>
    </div>

    <!-- Modal Formulario Producto Admin (Crear / Editar) -->
    <div class="modal" id="admin-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-admin-title">Nuevo Producto</h2>
                <button class="close-modal" onclick="cerrarModalAdmin()">&times;</button>
            </div>
            <form id="form-nuevo-producto" onsubmit="guardarProducto(event)">
                <input type="hidden" id="prod-id" value="">
                
                <div class="form-group">
                    <label>Nombre del Producto:</label>
                    <input type="text" id="prod-nombre" placeholder="Ej. Playera Deportiva Negra" required>
                </div>
                <div class="form-group">
                    <label>Precio (MXN):</label>
                    <input type="number" id="prod-precio" placeholder="350" required>
                </div>
                <div class="form-group">
                    <label>Categoría:</label>
                    <select id="prod-categoria" onchange="actualizarTallasFormulario()">
                        <!-- Opciones dinámicas de categorías -->
                    </select>
                </div>
                <div class="form-group">
                    <label>Estado inicial:</label>
                    <select id="prod-disponible">
                        <option value="true">Disponible</option>
                        <option value="false">Agotado</option>
                    </select>
                </div>

                <!-- TALLAS DE GORRAS -->
                <div class="form-group" id="group-tallas-gorras">
                    <label>Selecciona Tallas de Gorra:</label>
                    <div class="sizes-checkbox-container">
                        <label class="size-checkbox-label"><input type="checkbox" class="chk-talla-gorra" value="Ajustable"> Ajustable</label>
                        <label class="size-checkbox-label"><input type="checkbox" class="chk-talla-gorra" value="Flexfit"> Flexfit</label>
                        <label class="size-checkbox-label"><input type="checkbox" class="chk-talla-gorra" value="S/M"> S/M</label>
                        <label class="size-checkbox-label"><input type="checkbox" class="chk-talla-gorra" value="L/XL"> L/XL</label>
                        <label class="size-checkbox-label"><input type="checkbox" class="chk-talla-gorra" value="6 7/8"> 6 7/8</label>
                        <label class="size-checkbox-label"><input type="checkbox" class="chk-talla-gorra" value="7"> 7</label>
                        <label class="size-checkbox-label"><input type="checkbox" class="chk-talla-gorra" value="7 1/8"> 7 1/8</label>
                        <label class="size-checkbox-label"><input type="checkbox" class="chk-talla-gorra" value="7 1/4"> 7 1/4</label>
                        <label class="size-checkbox-label"><input type="checkbox" class="chk-talla-gorra" value="7 3/8"> 7 3/8</label>
                        <label class="size-checkbox-label"><input type="checkbox" class="chk-talla-gorra" value="7 1/2"> 7 1/2</label>
                        <label class="size-checkbox-label"><input type="checkbox" class="chk-talla-gorra" value="7 5/8"> 7 5/8</label>
                        <label class="size-checkbox-label"><input type="checkbox" class="chk-talla-gorra" value="7 3/4"> 7 3/4</label>
                        <label class="size-checkbox-label"><input type="checkbox" class="chk-talla-gorra" value="7 7/8"> 7 7/8</label>
                        <label class="size-checkbox-label"><input type="checkbox" class="chk-talla-gorra" value="8"> 8</label>
                    </div>
                </div>

                <!-- TALLAS OTROS PRODUCTOS -->
                <div class="form-group" id="group-tallas-ropa" style="display: none;">
                    <label>Selecciona Tallas del Producto:</label>
                    <div class="sizes-checkbox-container">
                        <label class="size-checkbox-label"><input type="checkbox" class="chk-talla-ropa" value="Unitalla"> Unitalla</label>
                        <label class="size-checkbox-label"><input type="checkbox" class="chk-talla-ropa" value="XS"> XS</label>
                        <label class="size-checkbox-label"><input type="checkbox" class="chk-talla-ropa" value="S"> S</label>
                        <label class="size-checkbox-label"><input type="checkbox" class="chk-talla-ropa" value="M"> M</label>
                        <label class="size-checkbox-label"><input type="checkbox" class="chk-talla-ropa" value="L"> L</label>
                        <label class="size-checkbox-label"><input type="checkbox" class="chk-talla-ropa" value="XL"> XL</label>
                        <label class="size-checkbox-label"><input type="checkbox" class="chk-talla-ropa" value="XXL"> XXL</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Cargar Nueva Imagen (Opcional si vas a editar):</label>
                    <input type="file" id="prod-file" accept="image/*" onchange="convertirImagenADataURL(event)">
                </div>
                <div class="form-group">
                    <label>O Enlace de Google Drive / URL:</label>
                    <input type="text" id="prod-img-url" placeholder="Pega el enlace aquí">
                </div>
                <button type="submit" class="btn-save-product" id="btn-save">Publicar Producto</button>
            </form>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN DE SUPABASE Y WHATSAPP
        const SUPABASE_URL = "https://ywixgizcadytczxcbubg.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl3aXhnaXpjYWR5dGN6eGNidWJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMzkzNTIsImV4cCI6MjEwMzcxNTM1Mn0.ABIAb8426hAdnJw5nxvGhxorAL6s8RHvlhHkDsb06Ts";
        
        // Reemplaza los ceros por tu número de WhatsApp real (Ej: "524921234567")
        const NUMERO_WHATSAPP = "520000000000"; 

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ESTADO GLOBAL
        let productos = [];
        let categorias = ["Gorras", "Ropa Deportiva", "Ofertas"];
        let carrito = [];
        let categoriaActual = "Todas";
        let esAdmin = false;
        let imagenTemporalDataURL = "";

        // INICIALIZACIÓN
        window.onload = async () => {
            cargarCategoriasGuardadas();
            renderizarBarraCategorias();
            renderizarSelectCategorias();
            await comprobarSesion();
            await cargarProductosDesdeSupabase();
        };

        // GESTIÓN DE CATEGORÍAS EN LOCALSTORAGE
        function cargarCategoriasGuardadas() {
            const guardadas = localStorage.getItem("iguano_categorias");
            if (guardadas) {
                categorias = JSON.parse(guardadas);
            }
        }

        function guardarCategorias() {
            localStorage.setItem("iguano_categorias", JSON.stringify(categorias));
        }

        function renderizarBarraCategorias() {
            const contenedor = document.getElementById("categories-bar");
            let html = `<button class="category-btn ${categoriaActual === 'Todas' ? 'active' : ''}" onclick="filtrarCategoria('Todas', this)">Todas</button>`;

            categorias.forEach(cat => {
                const activeClass = categoriaActual === cat ? 'active' : '';
                html += `<button class="category-btn ${activeClass}" onclick="filtrarCategoria('${cat}', this)">${cat}</button>`;
            });

            contenedor.innerHTML = html;
        }

        function renderizarSelectCategorias() {
            const select = document.getElementById("prod-categoria");
            let html = "";
            categorias.forEach(cat => {
                html += `<option value="${cat}">${cat}</option>`;
            });
            select.innerHTML = html;
        }

        function abrirModalCategorias() {
            renderizarListaAdministrarCategorias();
            document.getElementById("categories-modal").classList.add("open");
        }

        function cerrarModalCategorias() {
            document.getElementById("categories-modal").classList.remove("open");
        }

        function renderizarListaAdministrarCategorias() {
            const lista = document.getElementById("category-manage-list");
            if (categorias.length === 0) {
                lista.innerHTML = `<p style="color: var(--text-muted); font-size: 0.85rem;">No hay categorías personalizadas.</p>`;
                return;
            }

            let html = "";
            categorias.forEach((cat, index) => {
                html += `
                    <div class="category-manage-item">
                        <span>${cat}</span>
                        <button class="btn-delete-cat" onclick="eliminarCategoria(${index})">Eliminar</button>
                    </div>
                `;
            });
            lista.innerHTML = html;
        }

        function agregarCategoria(event) {
            event.preventDefault();
            const input = document.getElementById("cat-nombre");
            const nuevaCat = input.value.trim();

            if (nuevaCat && !categorias.includes(nuevaCat) && nuevaCat !== "Todas") {
                categorias.push(nuevaCat);
                guardarCategorias();
                renderizarBarraCategorias();
                renderizarSelectCategorias();
                renderizarListaAdministrarCategorias();
                input.value = "";
            } else {
                alert("Nombre de categoría no válido o ya existente.");
            }
        }

        function eliminarCategoria(index) {
            const catAEliminar = categorias[index];
            if (confirm(`¿Seguro que deseas eliminar la categoría "${catAEliminar}"?`)) {
                categorias.splice(index, 1);
                guardarCategorias();
                
                if (categoriaActual === catAEliminar) {
                    categoriaActual = "Todas";
                }
                
                renderizarBarraCategorias();
                renderizarSelectCategorias();
                renderizarListaAdministrarCategorias();
                renderizarCatalogo();
            }
        }

        // CARGAR PRODUCTOS DESDE SUPABASE
        async function cargarProductosDesdeSupabase() {
            const contenedor = document.getElementById("catalog-container");
            contenedor.innerHTML = '<p style="color: var(--text-muted); text-align: center; grid-column: 1/-1; padding: 20px;">Cargando productos...</p>';

            try {
                const { data, error } = await supabaseClient
                    .from('productos')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                productos = data || [];
                renderizarCatalogo();
            } catch (err) {
                console.error("Error al cargar productos:", err);
                contenedor.innerHTML = '<p style="color: #ef4444; text-align: center; grid-column: 1/-1; padding: 20px;">Error al conectar con la base de datos.</p>';
            }
        }

        // RENDERIZADO DEL CATÁLOGO
        function renderizarCatalogo() {
            const contenedor = document.getElementById("catalog-container");
            const busqueda = document.getElementById("search-input").value.toLowerCase().trim();

            let filtrados = productos.filter(p => {
                const coincideCategoria = (categoriaActual === "Todas") || (p.categoria === categoriaActual);
                const coincideBusqueda = p.nombre.toLowerCase().includes(busqueda);
                return coincideCategoria && coincideBusqueda;
            });

            if (filtrados.length === 0) {
                contenedor.innerHTML = '<p style="color: var(--text-muted); text-align: center; grid-column: 1/-1; padding: 40px 20px;">No se encontraron productos en esta sección.</p>';
                return;
            }

            let html = "";
            filtrados.forEach(prod => {
                const estaAgotado = !prod.disponible;
                const claseAgotado = estaAgotado ? 'out-of-stock' : '';
                const displayAdmin = esAdmin ? 'flex' : 'none';
                const displayBlockAdmin = esAdmin ? 'block' : 'none';

                let opcionesTallas = "";
                if (prod.tallas && prod.tallas.length > 0) {
                    prod.tallas.forEach(talla => {
                        opcionesTallas += `<option value="${talla}">${talla}</option>`;
                    });
                } else {
                    opcionesTallas = `<option value="Única">Talla Única</option>`;
                }

                const imgUrl = prod.imagen || 'https://via.placeholder.com/300x300?text=Sin+Imagen';

                html += `
                    <div class="product-card ${claseAgotado}">
                        ${estaAgotado ? '<div class="badge-out-of-stock">Agotado</div>' : ''}
                        
                        <button class="btn-toggle-stock-admin" style="display: ${displayAdmin};" onclick="alternarStock('${prod.id}', ${prod.disponible})">
                            ${prod.disponible ? 'Desactivar' : 'Activar'}
                        </button>
                        <button class="btn-edit-admin" style="display: ${displayAdmin};" onclick="abrirModalAdminEditar('${prod.id}')">✏️</button>
                        <button class="btn-delete-admin" style="display: ${displayBlockAdmin};" onclick="eliminarProducto('${prod.id}')">&times;</button>
                        
                        <img src="${imgUrl}" alt="${prod.nombre}" class="product-img" onclick="abrirVisorImagen('${imgUrl}')">
                        
                        <div class="product-info">
                            <h3 class="product-title">${prod.nombre}</h3>
                            <div class="product-price">$${prod.precio} MXN</div>
                            
                            <select class="product-size-select" id="select-size-${prod.id}" ${estaAgotado ? 'disabled' : ''}>
                                ${opcionesTallas}
                            </select>
                            
                            ${estaAgotado ? 
                                `<button class="btn-disabled" disabled>AGOTADO</button>` : 
                                `<button class="btn-add" onclick="agregarAlCarrito('${prod.id}')">AGREGAR</button>`
                            }
                        </div>
                    </div>
                `;
            });

            contenedor.innerHTML = html;
        }

        // NAVEGACIÓN Y BÚSQUEDA
        function filtrarCategoria(cat, btn) {
            categoriaActual = cat;
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            renderizarCatalogo();
        }

        function ejecutarBusqueda() {
            renderizarCatalogo();
        }

        // MODAL DE VISOR DE IMÁGENES
        function abrirVisorImagen(url) {
            document.getElementById("image-viewer-img").src = url;
            document.getElementById("image-viewer-modal").classList.add("open");
        }

        function cerrarVisorImagen() {
            document.getElementById("image-viewer-modal").classList.remove("open");
        }

        // CARRITO DE COMPRAS
        function agregarAlCarrito(idProd) {
            const prod = productos.find(p => p.id === idProd);
            if (!prod) return;

            const selectTalla = document.getElementById(`select-size-${idProd}`);
            const tallaSeleccionada = selectTalla ? selectTalla.value : "Única";

            const itemExistente = carrito.find(item => item.id === idProd && item.talla === tallaSeleccionada);

            if (itemExistente) {
                itemExistente.cantidad += 1;
            } else {
                carrito.push({
                    id: prod.id,
                    nombre: prod.nombre,
                    precio: prod.precio,
                    imagen: prod.imagen,
                    talla: tallaSeleccionada,
                    cantidad: 1
                });
            }

            actualizarInterfazCarrito();
        }

        function cambiarCantidadCarrito(index, cambio) {
            carrito[index].cantidad += cambio;
            if (carrito[index].cantidad <= 0) {
                carrito.splice(index, 1);
            }
            actualizarInterfazCarrito();
            renderizarCarritoModal();
        }

        function eliminarDelCarrito(index) {
            carrito.splice(index, 1);
            actualizarInterfazCarrito();
            renderizarCarritoModal();
        }

        function actualizarInterfazCarrito() {
            const totalPrendas = carrito.reduce((acc, item) => acc + item.cantidad, 0);
            const precioTotal = carrito.reduce((acc, item) => acc + (item.precio * item.cantidad), 0);

            document.getElementById("cart-count-label").innerText = `🛒 Carrito (${totalPrendas} prendas)`;
            document.getElementById("cart-total-label").innerText = `$${precioTotal} MXN →`;
            document.getElementById("modal-total-label").innerText = `$${precioTotal} MXN`;
        }

        function abrirCarrito() {
            renderizarCarritoModal();
            document.getElementById("cart-modal").classList.add("open");
        }

        function cerrarCarrito() {
            document.getElementById("cart-modal").classList.remove("open");
        }

        function renderizarCarritoModal() {
            const contenedor = document.getElementById("cart-items-container");
            if (carrito.length === 0) {
                contenedor.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 20px;">El carrito está vacío.</p>';
                return;
            }

            let html = "";
            carrito.forEach((item, index) => {
                const imgUrl = item.imagen || 'https://via.placeholder.com/100';
                html += `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <img src="${imgUrl}" alt="${item.nombre}" class="cart-item-img" onclick="abrirVisorImagen('${imgUrl}')">
                            <div class="cart-item-details">
                                <span class="cart-item-title">${item.nombre}</span>
                                <span class="cart-item-size">Talla: ${item.talla}</span>
                                <span class="cart-item-price">$${item.precio * item.cantidad} MXN</span>
                            </div>
                        </div>
                        <div class="cart-actions">
                            <div class="cart-controls">
                                <button class="btn-qty" onclick="cambiarCantidadCarrito(${index}, -1)">-</button>
                                <span class="cart-qty">${item.cantidad}</span>
                                <button class="btn-qty" onclick="cambiarCantidadCarrito(${index}, 1)">+</button>
                            </div>
                            <button class="btn-remove-item" onclick="eliminarDelCarrito(${index})">&times;</button>
                        </div>
                    </div>
                `;
            });
            contenedor.innerHTML = html;
        }

        function enviarPedidoWhatsApp() {
            if (carrito.length === 0) {
                alert("Tu carrito está vacío.");
                return;
            }

            let mensaje = "¡Hola! Quiero realizar el siguiente pedido en El iguano:\n\n";
            let total = 0;

            carrito.forEach(item => {
                const subtotal = item.precio * item.cantidad;
                total += subtotal;
                mensaje += `• ${item.nombre} (Talla: ${item.talla}) x${item.cantidad} - $${subtotal} MXN\n`;
            });

            mensaje += `\n*Total a pagar: $${total} MXN*`;

            const url = `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
        }

        // PANEL ADMINISTRADOR (SUPABASE AUTH)
        async function comprobarSesion() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            esAdmin = !!session;
            actualizarEstadoAdminUI();
        }

        function actualizarEstadoAdminUI() {
            const profileBtn = document.getElementById("admin-profile-btn");
            const btnAdd = document.getElementById("btn-admin-add");
            const btnCat = document.getElementById("btn-admin-cat");
            const btnLogout = document.getElementById("btn-admin-logout");

            if (esAdmin) {
                profileBtn.classList.add("logged-in");
                btnAdd.style.display = "block";
                btnCat.style.display = "block";
                btnLogout.style.display = "block";
            } else {
                profileBtn.classList.remove("logged-in");
                btnAdd.style.display = "none";
                btnCat.style.display = "none";
                btnLogout.style.display = "none";
            }
            renderizarCatalogo();
        }

        function manejarClicIconoAdmin() {
            if (esAdmin) {
                abrirModalAdminCrear();
            } else {
                document.getElementById("login-modal").classList.add("open");
            }
        }

        function cerrarModalLogin() {
            document.getElementById("login-modal").classList.remove("open");
        }

        async function iniciarSesionAdmin(event) {
            event.preventDefault();
            const email = document.getElementById("login-email").value;
            const password = document.getElementById("login-password").value;
            const btnSubmit = document.getElementById("btn-login-submit");

            btnSubmit.innerText = "Cargando...";
            btnSubmit.disabled = true;

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) throw error;

                esAdmin = true;
                actualizarEstadoAdminUI();
                cerrarModalLogin();
            } catch (err) {
                alert("Error de autenticación: " + err.message);
            } finally {
                btnSubmit.innerText = "INICIAR SESIÓN";
                btnSubmit.disabled = false;
            }
        }

        async function cerrarSesionAdmin() {
            await supabaseClient.auth.signOut();
            esAdmin = false;
            actualizarEstadoAdminUI();
        }

        // GESTIÓN DE PRODUCTOS (CREAR / EDITAR / ELIMINAR / STOCK)
        function actualizarTallasFormulario() {
            const cat = document.getElementById("prod-categoria").value;
            const groupGorras = document.getElementById("group-tallas-gorras");
            const groupRopa = document.getElementById("group-tallas-ropa");

            if (cat === "Gorras") {
                groupGorras.style.display = "block";
                groupRopa.style.display = "none";
            } else {
                groupGorras.style.display = "none";
                groupRopa.style.display = "block";
            }
        }

        function convertirImagenADataURL(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagenTemporalDataURL = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function abrirModalAdminCrear() {
            document.getElementById("modal-admin-title").innerText = "Nuevo Producto";
            document.getElementById("prod-id").value = "";
            document.getElementById("prod-nombre").value = "";
            document.getElementById("prod-precio").value = "";
            document.getElementById("prod-disponible").value = "true";
            document.getElementById("prod-img-url").value = "";
            document.getElementById("prod-file").value = "";
            imagenTemporalDataURL = "";

            document.querySelectorAll('.chk-talla-gorra, .chk-talla-ropa').forEach(chk => chk.checked = false);
            actualizarTallasFormulario();
            document.getElementById("admin-modal").classList.add("open");
        }

        function abrirModalAdminEditar(idProd) {
            const prod = productos.find(p => p.id === idProd);
            if (!prod) return;

            document.getElementById("modal-admin-title").innerText = "Editar Producto";
            document.getElementById("prod-id").value = prod.id;
            document.getElementById("prod-nombre").value = prod.nombre;
            document.getElementById("prod-precio").value = prod.precio;
            document.getElementById("prod-categoria").value = prod.categoria;
            document.getElementById("prod-disponible").value = prod.disponible ? "true" : "false";
            document.getElementById("prod-img-url").value = prod.imagen || "";
            document.getElementById("prod-file").value = "";
            imagenTemporalDataURL = "";

            actualizarTallasFormulario();

            document.querySelectorAll('.chk-talla-gorra, .chk-talla-ropa').forEach(chk => {
                chk.checked = prod.tallas ? prod.tallas.includes(chk.value) : false;
            });

            document.getElementById("admin-modal").classList.add("open");
        }

        function cerrarModalAdmin() {
            document.getElementById("admin-modal").classList.remove("open");
        }

        async function guardarProducto(event) {
            event.preventDefault();

            const id = document.getElementById("prod-id").value;
            const nombre = document.getElementById("prod-nombre").value.trim();
            const precio = parseFloat(document.getElementById("prod-precio").value);
            const categoria = document.getElementById("prod-categoria").value;
            const disponible = document.getElementById("prod-disponible").value === "true";
            const urlInput = document.getElementById("prod-img-url").value.trim();

            let imagenFinal = urlInput;
            if (imagenTemporalDataURL) {
                imagenFinal = imagenTemporalDataURL;
            }

            let tallasSeleccionadas = [];
            const selectorCheckboxes = categoria === "Gorras" ? ".chk-talla-gorra:checked" : ".chk-talla-ropa:checked";
            document.querySelectorAll(selectorCheckboxes).forEach(chk => {
                tallasSeleccionadas.push(chk.value);
            });

            const btnSave = document.getElementById("btn-save");
            btnSave.innerText = "Guardando...";
            btnSave.disabled = true;

            const datosProducto = {
                nombre,
                precio,
                categoria,
                disponible,
                imagen: imagenFinal,
                tallas: tallasSeleccionadas
            };

            try {
                if (id) {
                    const { error } = await supabaseClient.from('productos').update(datosProducto).eq('id', id);
                    if (error) throw error;
                } else {
                    const { error } = await supabaseClient.from('productos').insert([datosProducto]);
                    if (error) throw error;
                }

                cerrarModalAdmin();
                await cargarProductosDesdeSupabase();
            } catch (err) {
                alert("Error al guardar el producto: " + err.message);
            } finally {
                btnSave.innerText = "Publicar Producto";
                btnSave.disabled = false;
            }
        }

        async function alternarStock(idProd, estadoActual) {
            try {
                const { error } = await supabaseClient
                    .from('productos')
                    .update({ disponible: !estadoActual })
                    .eq('id', idProd);

                if (error) throw error;
                await cargarProductosDesdeSupabase();
            } catch (err) {
                alert("Error al cambiar el estado del producto: " + err.message);
            }
        }

        async function eliminarProducto(idProd) {
            if (confirm("¿Seguro que deseas eliminar este producto?")) {
                try {
                    const { error } = await supabaseClient.from('productos').delete().eq('id', idProd);
                    if (error) throw error;
                    await cargarProductosDesdeSupabase();
                } catch (err) {
                    alert("Error al eliminar el producto: " + err.message);
                }
            }
        }

        // SCROLL HEADER COMPACTO
        window.addEventListener("scroll", () => {
            const header = document.getElementById("main-header");
            if (window.scrollY > 40) {
                header.classList.add("scrolled");
            } else {
                header.classList.remove("scrolled");
            }
        });
    </script>
</body>
</html>
