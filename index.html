<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El iguano | Caps & Sportswear</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #f5f5f0;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border-color: #2a2a2a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 90px;
        }

        /* Header Dinámico */
        header {
            background-color: #181818;
            padding: 20px 15px 15px 15px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .brand-logo {
            width: 70px;
            height: 70px;
            object-fit: contain;
            border-radius: 50%;
            transition: all 0.3s ease;
            user-select: none;
        }

        .header-text {
            max-height: 100px;
            opacity: 1;
            overflow: hidden;
            transition: all 0.3s ease;
            margin-top: 8px;
        }

        header h1 {
            font-size: 1.6rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent-color);
            font-weight: 800;
        }

        header p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        header.scrolled {
            padding: 8px 15px;
        }

        header.scrolled .brand-logo {
            width: 42px;
            height: 42px;
        }

        header.scrolled .header-text {
            max-height: 0;
            opacity: 0;
            margin-top: 0;
        }

        /* Barra de Búsqueda */
        .search-container {
            padding: 12px 15px 5px 15px;
            background-color: var(--bg-color);
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 25px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent-color);
        }

        /* Categorías y Botón Admin */
        .categories-wrapper {
            display: flex;
            align-items: center;
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 60px;
            z-index: 90;
            padding: 10px 15px;
            gap: 10px;
        }

        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            flex-grow: 1;
        }

        .category-btn {
            background-color: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 8px 18px;
            border-radius: 25px;
            white-space: nowrap;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .category-btn.active {
            background-color: var(--accent-color);
            color: #121212;
            border-color: var(--accent-color);
        }

        .btn-admin-add {
            display: none;
            background-color: #22c55e;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
        }

        /* Catálogo */
        .catalog {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            padding: 15px;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .product-img {
            width: 100%;
            height: 170px;
            object-fit: cover;
            background-color: #252525;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .product-img:hover {
            transform: scale(1.02);
        }

        .product-info {
            padding: 12px;
        }

        .product-title {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .product-price {
            color: var(--accent-color);
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        /* Selector de Talla en Producto */
        .product-size-select {
            width: 100%;
            padding: 6px;
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.8rem;
            margin-bottom: 10px;
            outline: none;
            cursor: pointer;
        }

        /* Botón Comprar Ahora */
        .btn-buy-now {
            width: 100%;
            background-color: #22c55e;
            color: #ffffff;
            border: none;
            padding: 9px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Botón Agregar al Carrito */
        .btn-add {
            width: 100%;
            background-color: var(--accent-color);
            color: #121212;
            border: none;
            padding: 9px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-delete-admin {
            display: none;
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(239, 68, 68, 0.9);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            font-weight: bold;
            cursor: pointer;
            z-index: 5;
        }

        /* Barra Inferior del Carrito */
        .cart-bar {
            position: fixed;
            bottom: 15px;
            left: 5%;
            width: 90%;
            background-color: var(--accent-color);
            color: #121212;
            padding: 14px 20px;
            border-radius: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            cursor: pointer;
            z-index: 101;
        }

        /* Modales */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 200;
            justify-content: center;
            align-items: flex-end;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            background-color: #181818;
            width: 100%;
            max-width: 500px;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            border-top: 1px solid var(--border-color);
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .modal-header h2 {
            font-size: 1.2rem;
            color: var(--accent-color);
        }

        .close-modal {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .cart-items {
            overflow-y: auto;
            flex-grow: 1;
            margin-bottom: 15px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
            gap: 10px;
        }

        .cart-item-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-grow: 1;
        }

        .cart-item-img {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 8px;
            background-color: #252525;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        .cart-item-details {
            display: flex;
            flex-direction: column;
        }

        .cart-item-title {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .cart-item-size {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .cart-item-price {
            font-size: 0.85rem;
            color: var(--accent-color);
            font-weight: 700;
        }

        .cart-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cart-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: var(--card-bg);
            padding: 4px 8px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .btn-qty {
            background: none;
            border: none;
            color: var(--text-main);
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .btn-qty:active {
            background-color: var(--border-color);
        }

        .cart-qty {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-color);
            min-width: 16px;
            text-align: center;
        }

        .btn-remove-item {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }

        .btn-remove-item:active {
            opacity: 0.6;
        }

        .cart-footer {
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .btn-send-whatsapp {
            width: 100%;
            background-color: #22c55e;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Formulario Administrador y Selección de Tallas */
        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-group input[type="text"], 
        .form-group input[type="number"], 
        .form-group select {
            width: 100%;
            padding: 10px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.9rem;
        }

        /* Checkboxes de Tallas */
        .sizes-checkbox-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            background-color: var(--card-bg);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .size-checkbox-label {
            display: flex;
            align-items: center;
            gap: 5px;
            background-color: #2a2a2a;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
            user-select: none;
            border: 1px solid var(--border-color);
        }

        .size-checkbox-label input[type="checkbox"] {
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        .btn-save-product {
            width: 100%;
            background-color: var(--accent-color);
            color: #121212;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header id="main-header">
        <img src="Logo.jpeg" alt="El iguano Logo" class="brand-logo">
        <div class="header-text">
            <h1>El iguano</h1>
            <p>Caps & Sportswear</p>
        </div>
    </header>

    <div class="search-container">
        <input type="text" id="search-input" class="search-input" placeholder="🔍 Buscar gorra, playera, hoodie..." oninput="ejecutarBusqueda()">
    </div>

    <div class="categories-wrapper">
        <div class="categories">
            <button class="category-btn active" onclick="filtrarCategoria('Todas', this)">Todas</button>
            <button class="category-btn" onclick="filtrarCategoria('Gorras', this)">Gorras</button>
            <button class="category-btn" onclick="filtrarCategoria('Ropa Deportiva', this)">Ropa Deportiva</button>
            <button class="category-btn" onclick="filtrarCategoria('Ofertas', this)">Ofertas</button>
        </div>
        <button class="btn-admin-add" id="btn-admin-add" onclick="abrirModalAdmin()">➕ Agregar Producto</button>
    </div>

    <main class="catalog" id="catalog-container">
        <p style="color: var(--text-muted); text-align: center; grid-column: 1/-1; padding: 20px;">Cargando productos...</p>
    </main>

    <div class="cart-bar" onclick="abrirCarrito()">
        <span id="cart-count-label">🛒 Carrito (0 prendas)</span>
        <span id="cart-total-label">$0 MXN &rarr;</span>
    </div>

    <div class="modal" id="image-viewer-modal" style="align-items: center;" onclick="cerrarVisorImagen()">
        <div style="position: relative; max-width: 90vw; max-height: 90vh; display: flex; justify-content: center; align-items: center;" onclick="event.stopPropagation()">
            <button class="close-modal" onclick="cerrarVisorImagen()" style="position: absolute; top: -40px; right: 0; color: #fff; font-size: 2.5rem;">&times;</button>
            <img id="image-viewer-img" src="" alt="Vista previa" style="max-width: 100%; max-height: 80vh; border-radius: 12px; object-fit: contain; box-shadow: 0 10px 30px rgba(0,0,0,0.8);">
        </div>
    </div>

    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Tu Pedido</h2>
                <button class="close-modal" onclick="cerrarCarrito()">&times;</button>
            </div>
            <div class="cart-items" id="cart-items-container">
                <p style="color: var(--text-muted); text-align: center;">El carrito está vacío.</p>
            </div>
            <div class="cart-footer">
                <div class="cart-total">
                    <span>Cuenta Total:</span>
                    <span id="modal-total-label">$0 MXN</span>
                </div>
                <button class="btn-send-whatsapp" onclick="enviarPedidoWhatsApp()">Enviar pedido por WhatsApp</button>
            </div>
        </div>
    </div>

    <div class="modal" id="admin-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Nuevo Producto</h2>
                <button class="close-modal" onclick="cerrarModalAdmin()">&times;</button>
            </div>
            <form id="form-nuevo-producto" onsubmit="guardarNuevoProducto(event)">
                <div class="form-group">
                    <label>Nombre del Producto:</label>
                    <input type="text" id="prod-nombre" placeholder="Ej. Playera Deportiva Negra" required>
                </div>
                <div class="form-group">
                    <label>Precio (MXN):</label>
                    <input type="number" id="prod-precio" placeholder="350" required>
                </div>
                <div class="form-group">
                    <label>Categoría:</label>
                    <select id="prod-categoria">
                        <option value="Gorras">Gorras</option>
                        <option value="Ropa Deportiva">Ropa Deportiva</option>
                        <option value="Ofertas">Ofertas</option>
                    </select>
                </div>

                <!-- DESPLEGABLE / CHECKBOXES DE TALLAS -->
                <div class="form-group">
                    <label>Selecciona las Tallas Disponibles:</label>
                    <div class="sizes-checkbox-container">
                        <label class="size-checkbox-label"><input type="checkbox" class="chk-talla" value="Unitalla / Ajustable" checked> Unitalla</label>
                        <label class="size-checkbox-label"><input type="checkbox" class="chk-talla" value="XS"> XS</label>
                        <label class="size-checkbox-label"><input type="checkbox" class="chk-talla" value="S"> S</label>
                        <label class="size-checkbox-label"><input type="checkbox" class="chk-talla" value="M"> M</label>
                        <label class="size-checkbox-label"><input type="checkbox" class="chk-talla" value="L"> L</label>
                        <label class="size-checkbox-label"><input type="checkbox" class="chk-talla" value="XL"> XL</label>
                        <label class="size-checkbox-label"><input type="checkbox" class="chk-talla" value="XXL"> XXL</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Cargar Imagen desde tu Celular/PC:</label>
                    <input type="file" id="prod-file" accept="image/*" onchange="convertirImagenADataURL(event)">
                </div>
                <div class="form-group">
                    <label>O Enlace de Google Drive / URL:</label>
                    <input type="text" id="prod-img-url" placeholder="Pega el enlace aquí">
                </div>
                <button type="submit" class="btn-save-product" id="btn-save">Publicar Producto</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://ywixgizcadytczxcbubg.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl3aXhnaXpjYWR5dGN6eGNidWJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxMzkzNTIsImV4cCI6MjEwMzcxNTM1Mn0.ABIAb8426hAdnJw5nxvGhxorAL6s8RHvlhHkDsb06Ts";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const numeroTelefono = "524961228531";
        const PALABRA_CLAVE_ADMIN = "admin123"; 
        const ADMIN_PASSWORD = "iguano2026";    

        let esAdmin = false;
        let carrito = [];
        let categoriaActual = 'Todas';
        let productos = [];
        let imagenTemporalBase64 = "";

        document.addEventListener("DOMContentLoaded", () => {
            cargarProductosDesdeSupabase();
        });

        function abrirVisorImagen(src) {
            const modal = document.getElementById('image-viewer-modal');
            const img = document.getElementById('image-viewer-img');
            img.src = src;
            modal.classList.add('open');
        }

        function cerrarVisorImagen() {
            const modal = document.getElementById('image-viewer-modal');
            modal.classList.remove('open');
        }

        async function cargarProductosDesdeSupabase() {
            const container = document.getElementById('catalog-container');
            container.innerHTML = '<p style="color: var(--text-muted); text-align: center; grid-column: 1/-1; padding: 20px;">Cargando catálogo...</p>';

            const { data, error } = await supabaseClient.from('productos').select('*').order('id', { ascending: false });

            if (error) {
                console.error("Error al cargar productos:", error);
                container.innerHTML = '<p style="color: #ef4444; text-align: center; grid-column: 1/-1;">Error al cargar la tienda.</p>';
                return;
            }

            productos = data || [];
            ejecutarBusqueda();
        }

        function renderizarCatalogo(lista) {
            const container = document.getElementById('catalog-container');
            container.innerHTML = '';

            if (lista.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); text-align: center; grid-column: 1/-1; padding: 20px;">No hay productos disponibles por ahora.</p>';
                return;
            }

            lista.forEach(prod => {
                const listaTallas = prod.tallas ? prod.tallas.split(',').map(t => t.trim()) : ['Unitalla / Ajustable'];
                const opcionesTallaHTML = listaTallas.map(t => `<option value="${t}">${t}</option>`).join('');

                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    ${esAdmin ? `<button class="btn-delete-admin" style="display:block;" onclick="eliminarProducto(${prod.id})">&times;</button>` : ''}
                    <img src="${prod.img}" alt="${prod.nombre}" class="product-img" onclick="abrirVisorImagen('${prod.img}')" title="Haz clic para ampliar">
                    <div class="product-info">
                        <div class="product-title">${prod.nombre}</div>
                        <div class="product-price">$${prod.precio} MXN</div>
                        
                        <label style="font-size:0.75rem; color:var(--text-muted); display:block; margin-bottom:4px;">Talla:</label>
                        <select class="product-size-select" id="size-select-${prod.id}">
                            ${opcionesTallaHTML}
                        </select>

                        <div style="display: flex; flex-direction: column; gap: 6px;">
                            <button class="btn-buy-now" onclick="comprarAhoraDirecto('${prod.nombre}', ${prod.precio}, ${prod.id})">⚡ Comprar ahora</button>
                            <button class="btn-add" onclick="agregarAlCarrito('${prod.nombre}', ${prod.precio}, '${prod.img}', ${prod.id})">+ Agregar al carrito</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function comprarAhoraDirecto(nombre, precio, idProd) {
            const sizeSelect = document.getElementById(`size-select-${idProd}`);
            const tallaSeleccionada = sizeSelect ? sizeSelect.value : 'Unitalla / Ajustable';

            let mensaje = `Hola *El iguano*, me interesa comprar ahora mismo el siguiente producto:\n\n- ${nombre} (Talla: ${tallaSeleccionada}): $${precio} MXN`;
            window.open(`https://wa.me/${numeroTelefono}?text=${encodeURIComponent(mensaje)}`, '_blank');
        }

        function ejecutarBusqueda() {
            const query = document.getElementById('search-input').value.trim();

            if (query.toLowerCase() === PALABRA_CLAVE_ADMIN.toLowerCase()) {
                document.getElementById('search-input').value = '';
                activarModoAdmin();
                return;
            }

            let filtrados = productos;

            if (categoriaActual !== 'Todas') {
                filtrados = filtrados.filter(p => p.categoria === categoriaActual);
            }

            if (query !== '') {
                filtrados = filtrados.filter(p => p.nombre.toLowerCase().includes(query.toLowerCase()));
            }

            renderizarCatalogo(filtrados);
        }

        function filtrarCategoria(categoria, btn) {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            categoriaActual = categoria;
            ejecutarBusqueda();
        }

        function agregarAlCarrito(nombre, precio, img, idProd) {
            const sizeSelect = document.getElementById(`size-select-${idProd}`);
            const talla = sizeSelect ? sizeSelect.value : 'Unitalla / Ajustable';

            const existe = carrito.find(item => item.nombre === nombre && item.talla === talla);
            if (existe) {
                existe.cantidad += 1;
            } else {
                carrito.push({ nombre, precio, img, talla, cantidad: 1 });
            }
            actualizarCarritoUI();
        }

        function cambiarCantidad(index, cambio) {
            carrito[index].cantidad += cambio;
            if (carrito[index].cantidad <= 0) {
                eliminarDelCarrito(index);
                return;
            }
            actualizarCarritoUI();
        }

        function eliminarDelCarrito(index) {
            carrito.splice(index, 1);
            actualizarCarritoUI();
        }

        function actualizarCarritoUI() {
            const countLabel = document.getElementById('cart-count-label');
            const totalLabel = document.getElementById('cart-total-label');
            const modalTotalLabel = document.getElementById('modal-total-label');
            const itemsContainer = document.getElementById('cart-items-container');

            const totalPrendas = carrito.reduce((sum, item) => sum + item.cantidad, 0);
            const totalDinero = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);

            countLabel.textContent = `🛒 Carrito (${totalPrendas} ${totalPrendas === 1 ? 'prenda' : 'prendas'})`;
            totalLabel.textContent = `$${totalDinero} MXN →`;
            modalTotalLabel.textContent = `$${totalDinero} MXN`;

            if (carrito.length === 0) {
                itemsContainer.innerHTML = '<p style="color: var(--text-muted); text-align: center;">El carrito está vacío.</p>';
            } else {
                itemsContainer.innerHTML = '';
                carrito.forEach((item, index) => {
                    const subtotal = item.precio * item.cantidad;
                    const itemElement = document.createElement('div');
                    itemElement.className = 'cart-item';
                    itemElement.innerHTML = `
                        <div class="cart-item-info">
                            <img src="${item.img}" alt="${item.nombre}" class="cart-item-img" onclick="abrirVisorImagen('${item.img}')">
                            <div class="cart-item-details">
                                <div class="cart-item-title">${item.nombre}</div>
                                <div class="cart-item-size">Talla: <strong>${item.talla}</strong></div>
                                <div class="cart-item-price">$${subtotal} MXN <span style="font-size:0.75rem; color:var(--text-muted); font-weight:normal;">($${item.precio} c/u)</span></div>
                            </div>
                        </div>
                        <div class="cart-actions">
                            <div class="cart-controls">
                                <button class="btn-qty" onclick="cambiarCantidad(${index}, -1)">-</button>
                                <span class="cart-qty">${item.cantidad}</span>
                                <button class="btn-qty" onclick="cambiarCantidad(${index}, 1)">+</button>
                            </div>
                            <button class="btn-remove-item" onclick="eliminarDelCarrito(${index})" title="Eliminar producto">🗑️</button>
                        </div>
                    `;
                    itemsContainer.appendChild(itemElement);
                });
            }
        }

        function abrirCarrito() { document.getElementById('cart-modal').classList.add('open'); }
        function cerrarCarrito() { document.getElementById('cart-modal').classList.remove('open'); }

        function enviarPedidoWhatsApp() {
            if (carrito.length === 0) {
                alert("Agrega al menos un producto al carrito antes de realizar el pedido.");
                return;
            }
            let listaProductos = carrito.map(item => `- ${item.nombre} (Talla: ${item.talla}) x${item.cantidad}: $${item.precio * item.cantidad} MXN`).join('\n');
            let totalPrendas = carrito.reduce((sum, item) => sum + item.cantidad, 0);
            let totalDinero = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);
            
            let mensaje = `Hola *El iguano*, me gustaría realizar el siguiente pedido desde la página web:\n\n${listaProductos}\n\n*Total de prendas:* ${totalPrendas}\n*Cuenta Total:* $${totalDinero} MXN`;
            window.open(`https://wa.me/${numeroTelefono}?text=${encodeURIComponent(mensaje)}`, '_blank');
        }

        function activarModoAdmin() {
            const pass = prompt("Acceso Administrador 'El iguano'\nIngresa la contraseña:");
            if (pass === ADMIN_PASSWORD) {
                esAdmin = true;
                alert("¡Modo Administrador activado!");
                document.getElementById('btn-admin-add').style.display = "block";
                renderizarCatalogo(productos);
            } else if (pass !== null) {
                alert("Contraseña incorrecta.");
            }
        }

        function abrirModalAdmin() { document.getElementById('admin-modal').classList.add('open'); }
        function cerrarModalAdmin() { document.getElementById('admin-modal').classList.remove('open'); }

        function convertirImagenADataURL(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagenTemporalBase64 = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        // GUARDAR NUEVO PRODUCTO LEYENDO LAS TALLAS SELECCIONADAS
        async function guardarNuevoProducto(event) {
            event.preventDefault();

            const btnSave = document.getElementById('btn-save');
            btnSave.disabled = true;
            btnSave.textContent = "Guardando en la nube...";

            const nombre = document.getElementById('prod-nombre').value;
            const precio = parseFloat(document.getElementById('prod-precio').value);
            const categoria = document.getElementById('prod-categoria').value;
            const urlInput = document.getElementById('prod-img-url').value;

            // Obtener todas las tallas marcadas en los checkboxes
            const checkboxes = document.querySelectorAll('.chk-talla:checked');
            let tallasSeleccionadas = Array.from(checkboxes).map(cb => cb.value);

            // Si no se marcó ninguna, se establece 'Unitalla / Ajustable' por defecto
            if (tallasSeleccionadas.length === 0) {
                tallasSeleccionadas = ["Unitalla / Ajustable"];
            }

            const tallas = tallasSeleccionadas.join(', ');
            let imgFinal = imagenTemporalBase64 || urlInput || "https://via.placeholder.com/300x300/1e1e1e/f5f5f0?text=El+Iguano";

            const { data, error } = await supabaseClient
                .from('productos')
                .insert([
                    { nombre, precio, categoria, tallas, img: imgFinal }
                ]);

            btnSave.disabled = false;
            btnSave.textContent = "Publicar Producto";

            if (error) {
                alert("Error al guardar el producto: " + error.message);
                return;
            }

            document.getElementById('form-nuevo-producto').reset();
            imagenTemporalBase64 = "";
            cerrarModalAdmin();
            alert("¡Producto publicado exitosamente!");
            cargarProductosDesdeSupabase();
        }

        async function eliminarProducto(id) {
            if (confirm("¿Estás seguro de eliminar este producto de la tienda para todos?")) {
                const { error } = await supabaseClient
                    .from('productos')
                    .delete()
                    .eq('id', id);

                if (error) {
                    alert("Error al eliminar: " + error.message);
                } else {
                    alert("Producto eliminado.");
                    cargarProductosDesdeSupabase();
                }
            }
        }

        window.addEventListener('scroll', function() {
            const header = document.getElementById('main-header');
            if (window.scrollY > 30) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });
    </script>
</body>
</html>
