<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El iguano | Caps & Sportswear</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #f5f5f0;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border-color: #2a2a2a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 90px; }
        header { background-color: #181818; padding: 20px 15px 15px 15px; text-align: center; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; transition: all 0.3s ease; }
        .header-content { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* Redes Sociales - Esquina Superior Izquierda */
        .social-header-links {
            position: absolute;
            top: 0;
            left: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        .social-header-links a {
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease, transform 0.2s ease;
        }
        .social-header-links a:hover {
            color: var(--accent-color);
            transform: scale(1.1);
        }
        .social-header-links svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
        .admin-profile-btn { position: absolute; top: 0; right: 10px; background: none; border: 1px solid var(--border-color); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted); }
        .admin-profile-btn.logged-in { border-color: #22c55e; color: #22c55e; background-color: rgba(34, 197, 94, 0.1); }
        .admin-profile-btn svg { width: 22px; height: 22px; fill: currentColor; }
        .brand-logo { width: 70px; height: 70px; object-fit: contain; border-radius: 50%; transition: all 0.3s ease; }
        .header-text { margin-top: 8px; transition: opacity 0.3s ease, max-height 0.3s ease, margin-top 0.3s ease; opacity: 1; max-height: 100px; overflow: hidden; }
        
        /* Ocultar texto y ajustar espacio de la cabecera al hacer scroll */
        header.scrolled { padding: 10px 15px; }
        header.scrolled .header-text { opacity: 0; max-height: 0; margin-top: 0; pointer-events: none; }
        header.scrolled .brand-logo { width: 50px; height: 50px; }
        .search-container { padding: 12px 15px 5px 15px; background-color: var(--bg-color); }
        .search-input { width: 100%; padding: 12px 16px; background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 25px; color: var(--text-main); font-size: 0.9rem; outline: none; }
        .categories-wrapper { display: flex; align-items: center; background-color: var(--bg-color); border-bottom: 1px solid var(--border-color); position: sticky; top: 60px; z-index: 90; padding: 10px 15px; gap: 10px; }
        .categories { display: flex; gap: 10px; overflow-x: auto; flex-grow: 1; align-items: center; }
        .category-btn { background-color: var(--card-bg); color: var(--text-muted); border: 1px solid var(--border-color); padding: 8px 18px; border-radius: 25px; white-space: nowrap; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
        .category-btn.active { background-color: var(--accent-color); color: #121212; border-color: var(--accent-color); }
        .subcategories-container { display: none; gap: 8px; padding: 10px 15px; background-color: #181818; border-bottom: 1px solid var(--border-color); overflow-x: auto; align-items: center; }
        .subcategories-container.open { display: flex; }
        .subcategory-btn { background-color: #252525; color: var(--text-muted); border: 1px solid var(--border-color); padding: 6px 14px; border-radius: 18px; white-space: nowrap; cursor: pointer; font-weight: 500; font-size: 0.78rem; }
        .subcategory-btn.active { background-color: #ffffff; color: #000000; border-color: #ffffff; font-weight: 700; }
        .admin-controls { display: flex; gap: 8px; }
        .btn-admin-add, .btn-admin-cat { display: none; background-color: #22c55e; color: #ffffff; border: none; padding: 8px 14px; border-radius: 25px; font-weight: 700; font-size: 0.8rem; cursor: pointer; white-space: nowrap; }
        .btn-admin-cat { background-color: #3b82f6; }
        .btn-admin-logout { display: none; background-color: #ef4444; color: #ffffff; border: none; padding: 8px 12px; border-radius: 25px; font-weight: 600; font-size: 0.8rem; cursor: pointer; white-space: nowrap; }
        .catalog { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; padding: 15px; }
        .product-card { background-color: var(--card-bg); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid var(--border-color); position: relative; }
        .product-card.out-of-stock .product-img { opacity: 0.4; filter: grayscale(80%); }
        .badge-out-of-stock { position: absolute; top: 10px; left: 10px; background-color: #ef4444; color: #ffffff; font-size: 0.7rem; font-weight: 800; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; z-index: 4; }
        .product-img { width: 100%; height: 170px; object-fit: cover; background-color: #252525; cursor: pointer; }
        .product-info { padding: 12px; }
        .product-code { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; margin-bottom: 2px; }
        .product-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 6px; }
        .product-price { color: var(--accent-color); font-size: 1.1rem; font-weight: 700; margin-bottom: 10px; }
        .product-size-select { width: 100%; padding: 6px; background-color: #2a2a2a; border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-main); font-size: 0.8rem; margin-bottom: 10px; outline: none; }
        .btn-buy-now { width: 100%; background-color: #22c55e; color: #ffffff; border: none; padding: 9px; border-radius: 6px; font-weight: 700; font-size: 0.8rem; cursor: pointer; text-transform: uppercase; }
        .btn-add { width: 100%; background-color: var(--accent-color); color: #121212; border: none; padding: 9px; border-radius: 6px; font-weight: 700; font-size: 0.8rem; cursor: pointer; text-transform: uppercase; }
        .btn-disabled { width: 100%; background-color: #333333; color: #777777; border: none; padding: 9px; border-radius: 6px; font-weight: 700; font-size: 0.8rem; cursor: not-allowed; text-transform: uppercase; }
        .btn-delete-admin, .btn-edit-admin { display: none; position: absolute; top: 8px; right: 8px; background: rgba(239, 68, 68, 0.9); color: #fff; border: none; border-radius: 50%; width: 28px; height: 28px; font-weight: bold; cursor: pointer; z-index: 5; }
        .btn-edit-admin { right: 40px; background: rgba(59, 130, 246, 0.9); }
        .btn-toggle-stock-admin { display: none; position: absolute; top: 8px; left: 8px; background: rgba(34, 197, 94, 0.9); color: #fff; border: none; border-radius: 14px; padding: 0 8px; height: 28px; font-size: 0.75rem; font-weight: bold; cursor: pointer; z-index: 5; }
        .load-more-container { text-align: center; padding: 20px 15px; }
        .btn-load-more { background-color: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color); padding: 12px 24px; border-radius: 25px; font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: all 0.2s ease; }
        .btn-load-more:hover { background-color: var(--accent-color); color: #121212; }
        .cart-bar { position: fixed; bottom: 15px; left: 5%; width: 90%; background-color: var(--accent-color); color: #121212; padding: 14px 20px; border-radius: 30px; display: flex; justify-content: space-between; align-items: center; font-weight: 700; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6); cursor: pointer; z-index: 101; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.85); z-index: 200; justify-content: center; align-items: flex-end; }
        .modal.open { display: flex; }
        .modal-content { background-color: #181818; width: 100%; max-width: 500px; border-radius: 20px 20px 0 0; padding: 20px; max-height: 85vh; display: flex; flex-direction: column; border-top: 1px solid var(--border-color); overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 15px; }
        .modal-header h2 { font-size: 1.2rem; color: var(--accent-color); }
        .close-modal { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }
        .cart-items { overflow-y: auto; flex-grow: 1; margin-bottom: 15px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border-color); gap: 10px; }
        .cart-item-info { display: flex; align-items: center; gap: 12px; flex-grow: 1; }
        .cart-item-img { width: 48px; height: 48px; object-fit: cover; border-radius: 8px; background-color: #252525; border: 1px solid var(--border-color); }
        .cart-item-details { display: flex; flex-direction: column; }
        .cart-item-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 2px; }
        .cart-item-code { font-size: 0.75rem; color: var(--accent-color); font-weight: 600; }
        .cart-item-size { font-size: 0.75rem; color: var(--text-muted); }
        .cart-item-price { font-size: 0.85rem; color: var(--accent-color); font-weight: 700; }
        .cart-controls { display: flex; align-items: center; gap: 6px; background-color: var(--card-bg); padding: 4px 8px; border-radius: 20px; border: 1px solid var(--border-color); }
        .btn-qty { background: none; border: none; color: var(--text-main); font-weight: bold; font-size: 1rem; cursor: pointer; width: 20px; height: 20px; }
        .cart-qty { font-size: 0.85rem; font-weight: 700; color: var(--accent-color); min-width: 16px; text-align: center; }
        .btn-remove-item { background: none; border: none; color: #ef4444; font-size: 1.1rem; cursor: pointer; padding: 4px; }
        .cart-footer { border-top: 1px solid var(--border-color); padding-top: 15px; }
        .cart-total { display: flex; justify-content: space-between; font-size: 1.1rem; font-weight: 700; margin-bottom: 15px; }
        .btn-send-whatsapp { width: 100%; background-color: #22c55e; color: #ffffff; border: none; padding: 12px; border-radius: 8px; font-weight: 700; font-size: 0.95rem; cursor: pointer; text-transform: uppercase; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
        .form-group input[type="text"], .form-group input[type="email"], .form-group input[type="password"], .form-group input[type="number"], .form-group select { width: 100%; padding: 10px; background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-main); font-size: 0.9rem; }
        .sizes-checkbox-container { display: flex; flex-wrap: wrap; gap: 8px; background-color: var(--card-bg); padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); }
        .size-checkbox-label { display: flex; align-items: center; gap: 5px; background-color: #2a2a2a; padding: 6px 10px; border-radius: 4px; font-size: 0.8rem; cursor: pointer; border: 1px solid var(--border-color); }
        .btn-save-product { width: 100%; background-color: var(--accent-color); color: #121212; border: none; padding: 12px; border-radius: 8px; font-weight: 700; font-size: 0.95rem; cursor: pointer; margin-top: 10px; }
        .btn-save-product:disabled { opacity: 0.5; cursor: not-allowed; }
        .cat-admin-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; margin-bottom: 8px; }
        .btn-cat-del { background-color: #ef4444; color: white; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
        /* Notificación Toast */
        .toast-notification {
            visibility: hidden;
            min-width: 250px;
            background-color: #22c55e;
            color: #ffffff;
            text-align: center;
            border-radius: 20px;
            padding: 12px 20px;
            position: fixed;
            z-index: 300;
            left: 50%;
            bottom: 80px;
            transform: translateX(-50%);
            font-size: 0.9rem;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            opacity: 0;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .toast-notification.show {
            visibility: visible;
            opacity: 1;
        }
        /* Controles de Navegación del Visor de Imágenes */
        .viewer-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: background 0.2s ease, transform 0.2s ease;
        }
        .viewer-nav-btn:hover {
            background: rgba(0, 0, 0, 0.9);
            transform: translateY(-50%) scale(1.1);
        }
        .viewer-prev { left: -20px; }
        .viewer-next { right: -20px; }
        .viewer-counter {
            position: absolute;
            bottom: -35px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <header id="main-header">
        <div class="header-content">
            <!-- Iconos de Redes Sociales (Esquina Superior Izquierda) -->
            <div class="social-header-links">
                <a href="https://wa.me/5214961228531" target="_blank" rel="noopener noreferrer" title="WhatsApp">

                </a>
                <a href="https://www.instagram.com/el_iguano_sp?igsi=MXg4emF1enVvazhsOA%3D%3D&utm_source=qr" target="_blank" rel="noopener noreferrer" title="Instagram">

                </a>
            </div>
            <button class="admin-profile-btn" id="admin-profile-btn" onclick="manejarClicIconoAdmin()" title="Mi Cuenta">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
            </button>
            <img src="Logo.jpeg" alt="El iguano Logo" class="brand-logo">
            <div class="header-text">
                <h1>El iguano</h1>
                <p>Caps & Sportswear</p>
            </div>
        </div>
    </header>
    <div class="search-container">
        <input type="text" id="search-input" class="search-input" placeholder="🔍 Buscar producto por nombre o código..." oninput="manejarCambioFiltros()">
    </div>
    
    <div class="categories-wrapper">
        <div class="categories" id="categories-bar-container">
            <!-- Carga dinámica -->
        </div>
        <div class="admin-controls">
            <button class="btn-admin-add" id="btn-admin-add" onclick="abrirModalAdminCrear()">➕ Producto</button>
            <button class="btn-admin-cat" id="btn-admin-cat" onclick="abrirModalGestionCategorias()">📂 Categorías</button>
            <button class="btn-admin-logout" id="btn-admin-logout" onclick="cerrarSesionAdmin()">Salir</button>
        </div>
    </div>
    <div class="subcategories-container" id="subcategories-container"></div>
    
    <main class="catalog" id="catalog-container">
        <p style="color: var(--text-muted); text-align: center; grid-column: 1/-1; padding: 20px;">Cargando catálogo...</p>
    </main>
    <div class="load-more-container" id="load-more-container" style="display: none;">
        <button class="btn-load-more" id="btn-load-more" onclick="cargarMasProductos()">Cargar más productos</button>
    </div>
    <div class="cart-bar" onclick="abrirCarrito()">
        <span id="cart-count-label">🛒 Carrito (0 prendas)</span>
        <span id="cart-total-label">$0 MXN &rarr;</span>
    </div>
    <!-- Toast Notification -->
    <div id="toast-notification" class="toast-notification">¡Producto agregado al carrito!</div>
    
    <!-- Visor Imagen Ampliada con Flechas de Navegación -->
    <div class="modal" id="image-viewer-modal" style="align-items: center;" onclick="cerrarVisorImagen()">
        <div style="position: relative; max-width: 90vw; max-height: 90vh; display: flex; align-items: center; justify-content: center;" onclick="event.stopPropagation()">
            <button class="close-modal" onclick="cerrarVisorImagen()" style="position: absolute; top: -40px; right: 0; color: #fff; font-size: 2.5rem;">&times;</button>
            
            <button class="viewer-nav-btn viewer-prev" id="viewer-prev-btn" onclick="navegarImagenVisor(-1)">&#10094;</button>
            <img id="image-viewer-img" src="" style="max-width: 100%; max-height: 80vh; border-radius: 12px; object-fit: contain;">
            <button class="viewer-nav-btn viewer-next" id="viewer-next-btn" onclick="navegarImagenVisor(1)">&#10095;</button>
            
            <div class="viewer-counter" id="viewer-counter-label">1 / 1</div>
        </div>
    </div>
    <!-- Modal Carrito -->
    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Tu Pedido</h2>
                <button class="close-modal" onclick="cerrarCarrito()">&times;</button>
            </div>
            <div class="cart-items" id="cart-items-container"></div>
            <div class="cart-footer">
                <div class="cart-total">
                    <span>Cuenta Total:</span>
                    <span id="modal-total-label">$0 MXN</span>
                </div>
                <button class="btn-send-whatsapp" onclick="enviarPedidoWhatsApp()">Enviar pedido por WhatsApp</button>
            </div>
        </div>
    </div>
    <!-- Modal Login -->
    <div class="modal" id="login-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>INICIAR SESIÓN</h2>
                <button class="close-modal" onclick="cerrarModalLogin()">&times;</button>
            </div>
            <form id="form-login-admin" onsubmit="iniciarSesionAdmin(event)">
                <div class="form-group">
                    <label>Correo Electrónico:</label>
                    <input type="email" id="login-email" required>
                </div>
                <div class="form-group">
                    <label>Contraseña:</label>
                    <input type="password" id="login-password" required>
                </div>
                <button type="submit" class="btn-save-product" id="btn-login-submit">INICIAR SESIÓN</button>
            </form>
        </div>
    </div>
    <!-- Modal Formulario Producto Admin -->
    <div class="modal" id="admin-modal">

        // Helper para convertir cualquier formato de imágenes (Array o String) a un Arreglo de URLs
        function obtenerArregloImagenes(campoImg) {
            if (!campoImg) return ['https://via.placeholder.com/300x300/1e1e1e/f5f5f0?text=El+Iguano'];
            if (Array.isArray(campoImg)) {
                return campoImg.filter(url => url && url.trim() !== '' && url !== 'null');
            }
            if (typeof campoImg === 'string') {
                const arr = campoImg.split(',').map(s => s.trim()).filter(url => url !== '' && url !== 'null');
                return arr.length > 0 ? arr : ['https://via.placeholder.com/300x300/1e1e1e/f5f5f0?text=El+Iguano'];
            }
            return ['https://via.placeholder.com/300x300/1e1e1e/f5f5f0?text=El+Iguano'];
        }
        // Carga de productos paginada desde Supabase (Versión Corregida)
        async function cargarProductosPaginados(esNuevaBusqueda = false) {
            const btnLoadMore = document.getElementById('btn-load-more');
            const container = document.getElementById('catalog-container');
            if (esNuevaBusqueda) {
                paginaActual = 0;
                productos = [];
                hayMasProductos = true;
                container.innerHTML = '<p style="color: var(--text-muted); text-align: center; grid-column: 1/-1; padding: 20px;">Cargando catálogo...</p>';
            }
            if (!hayMasProductos) return;
            btnLoadMore.textContent = "Cargando...";
            btnLoadMore.disabled = true;
            const desde = paginaActual * PAGE_SIZE;
            const hasta = desde + PAGE_SIZE - 1;
            let queryBuilder = supabaseClient
                .from('productos')
                .select('*', { count: 'exact' });
            if (categoriaActual !== 'Todas') {
                queryBuilder = queryBuilder.eq('categoria', categoriaActual);
            }
            if (subcategoriaActual !== 'Todas') {
                queryBuilder = queryBuilder.ilike('tallas', `%${subcategoriaActual}%`);
            }
            const queryText = document.getElementById('search-input').value.trim();
            if (queryText !== '') {
                queryBuilder = queryBuilder.or(`nombre.ilike.%${queryText}%,codigo.ilike.%${queryText}%`);
            }
            queryBuilder = queryBuilder.order('id', { ascending: false }).range(desde, hasta);
            const { data, count, error } = await queryBuilder;
            if (error) {
                console.error("Error al cargar productos:", error);
                btnLoadMore.textContent = "Error al cargar";
                return;
            }
            const recibidos = data || [];
            
            // FILTRO ANTI-DUPLICADOS:
            const idsExistentes = new Set(productos.map(p => p.id));
            const nuevosSinDuplicar = recibidos.filter(p => !idsExistentes.has(p.id));
            productos = esNuevaBusqueda ? recibidos : [...productos, ...nuevosSinDuplicar];
            if (productos.length >= count || recibidos.length < PAGE_SIZE) {
                hayMasProductos = false;
            }
            
            renderizarCatalogo(productos, esNuevaBusqueda, nuevosSinDuplicar);
            paginaActual++;
            const loadMoreContainer = document.getElementById('load-more-container');
            if (hayMasProductos) {
                loadMoreContainer.style.display = 'block';
                btnLoadMore.textContent = "Cargar más productos";
                btnLoadMore.disabled = false;
            } else {
                loadMoreContainer.style.display = 'none';
            }
        }
        function cargarMasProductos() {

        }

        async function subirImagenesASupabaseStorage(files) {
            const urlsSubidas = [];
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const fileExt = file.name.split('.').pop();
                const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 8)}_${i}.${fileExt}`;
                const filePath = `productos/${fileName}`;
                
                const { error } = await supabaseClient.storage
                    .from('productos')
                    .upload(filePath, file, { cacheControl: '3600', upsert: false });
                if (error) throw error;
                
                const { data: publicUrlData } = supabaseClient.storage
                    .from('productos')
                    .getPublicUrl(filePath);
                urlsSubidas.push(publicUrlData.publicUrl);
            }
            return urlsSubidas;
        }
        async function guardarProducto(event) {
            event.preventDefault();
            const btnSave = document.getElementById('btn-save');
            const prodId = document.getElementById('prod-id').value;
            const esEdicion = prodId !== '';
            const codigo = document.getElementById('prod-codigo').value.trim();
            const nombre = document.getElementById('prod-nombre').value;
            const precio = parseFloat(document.getElementById('prod-precio').value);
            const categoria = document.getElementById('prod-categoria').value;
            const disponible = document.getElementById('prod-disponible').value === 'true';
            const fileInput = document.getElementById('prod-file');
            const urlInput = document.getElementById('prod-img-url').value.trim();
            const chks = document.querySelectorAll('.chk-talla:checked');
            let tallas = Array.from(chks).map(c => c.value).join(', ');
            if (!tallas) tallas = "Única";
            
            let imagenesFinales = [];
            if (urlInput !== '') {
                imagenesFinales = urlInput.split(',').map(u => u.trim()).filter(u => u !== '');
            }
            try {
                btnSave.disabled = true;
                btnSave.textContent = "Guardando...";
                if (fileInput.files && fileInput.files.length > 0) {
                    btnSave.textContent = "Subiendo imágenes...";
                    const urlsArchivos = await subirImagenesASupabaseStorage(fileInput.files);
                    imagenesFinales = [...imagenesFinales, ...urlsArchivos];
                } else if (imagenesFinales.length === 0 && esEdicion) {
                    const prodActual = productos.find(p => p.id === parseInt(prodId));
                    if (prodActual) imagenesFinales = obtenerArregloImagenes(prodActual.img);
                }
                if (imagenesFinales.length === 0) {
                    imagenesFinales = ["https://via.placeholder.com/300x300/1e1e1e/f5f5f0?text=El+Iguano"];
                }
                let res;
                if (esEdicion) {
                    res = await supabaseClient.from('productos').update({ codigo, nombre, precio, categoria, tallas, disponible, img: imagenesFinales }).eq('id', prodId);
                } else {
                    res = await supabaseClient.from('productos').insert([{ codigo, nombre, precio, categoria, tallas, disponible, img: imagenesFinales }]);
                }
                if (res.error) {
                    alert("Error al guardar en la base de datos: " + res.error.message);
                } else {
                    cerrarModalAdmin();
                    cargarProductosPaginados(true);
                }
            } catch (err) {
                alert("Error al procesar la imagen en Storage: " + err.message);
            } finally {
                btnSave.disabled = false;
                btnSave.textContent = "Publicar Producto";
            }
        }
        async function cambiarEstadoStock(id, nuevoEstado) {
            await supabaseClient.from('productos').update({ disponible: nuevoEstado }).eq('id', id);
            cargarProductosPaginados(true);
        }
        async function eliminarProducto(id) {
            if (confirm("¿Eliminar producto?")) {
                await supabaseClient.from('productos').delete().eq('id', id);
                cargarProductosPaginados(true);
            }
        }
        function mostrarToast() {
            const toast = document.getElementById('toast-notification');
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
        function agregarAlCarrito(nombre, codigo, precio, img, idProd) {
            const sizeSelect = document.getElementById(`size-select-${idProd}`);
            const talla = sizeSelect ? sizeSelect.value : 'Única';
            const existe = carrito.find(item => item.nombre === nombre && item.talla === talla && item.codigo === codigo);
            if (existe) existe.cantidad += 1;
            else carrito.push({ codigo, nombre, precio, img, talla, cantidad: 1 });
            actualizarCarritoUI();
            mostrarToast();
        }
        function cambiarCantidad(index, cambio) {
            carrito[index].cantidad += cambio;
            if (carrito[index].cantidad <= 0) carrito.splice(index, 1);
            actualizarCarritoUI();
        }
        function eliminarDelCarrito(index) {
            carrito.splice(index, 1);
            actualizarCarritoUI();
        }
        function actualizarCarritoUI() {
            const totalPrendas = carrito.reduce((sum, item) => sum + item.cantidad, 0);
            const totalDinero = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);
            document.getElementById('cart-count-label').textContent = `🛒 Carrito (${totalPrendas} prendas)`;
            document.getElementById('cart-total-label').textContent = `$${totalDinero} MXN →`;
            document.getElementById('modal-total-label').textContent = `$${totalDinero} MXN`;
            const container = document.getElementById('cart-items-container');
            if (carrito.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); text-align: center;">El carrito está vacío.</p>';
            } else {
                container.innerHTML = carrito.map((item, index) => `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <img src="${item.img}" class="cart-item-img">
                            <div class="cart-item-details">
                                ${item.codigo ? `<div class="cart-item-code">[${item.codigo}]</div>` : ''}
                                <div class="cart-item-title">${item.nombre}</div>
                                <div class="cart-item-size">Talla: <strong>${item.talla}</strong></div>
                                <div class="cart-item-price">$${item.precio * item.cantidad} MXN</div>
                            </div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <div class="cart-controls">
                                <button class="btn-qty" onclick="cambiarCantidad(${index}, -1)">-</button>
                                <span class="cart-qty">${item.cantidad}</span>
                                <button class="btn-qty" onclick="cambiarCantidad(${index}, 1)">+</button>
                            </div>
                            <button class="btn-remove-item" onclick="eliminarDelCarrito(${index})" title="Eliminar del carrito">🗑️</button>
                        </div>
                    </div>
                `).join('');
            }
        }
        function abrirCarrito() { document.getElementById('cart-modal').classList.add('open'); }
        function cerrarCarrito() { document.getElementById('cart-modal').classList.remove('open'); }
        function comprarAhoraDirecto(nombre, codigo, precio, idProd) {
            const sizeSelect = document.getElementById(`size-select-${idProd}`);
            const talla = sizeSelect ? sizeSelect.value : 'Única';
            const textoCodigo = codigo ? `[${codigo}] ` : '';
            let mensaje = `Hola *Iguano*, me interesa comprar ahora mismo el siguiente producto:\n\n- ${textoCodigo}${nombre} (Talla: ${talla}): $${precio} MXN`;
            window.open(`https://wa.me/${numeroTelefono}?text=${encodeURIComponent(mensaje)}`, '_blank');
        }
        function enviarPedidoWhatsApp() {
            if (carrito.length === 0) return alert("El carrito está vacío.");
            let lista = carrito.map(i => {
                const textoCodigo = i.codigo ? `[${i.codigo}] ` : '';
                return `- ${textoCodigo}${i.nombre} (Talla: ${i.talla}) x${i.cantidad}: $${i.precio * i.cantidad} MXN`;
            }).join('\n');
            let totalDinero = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);
            let mensaje = `Hola *Iguano*, me gustaría realizar el siguiente pedido:\n\n${lista}\n\n*Cuenta Total:* $${totalDinero} MXN`;
            window.open(`https://wa.me/${numeroTelefono}?text=${encodeURIComponent(mensaje)}`, '_blank');
        }
    </script>
</body>
</html>
